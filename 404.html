<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
  <!-- Sicherheits-Kopfzeilen, 26.09.2026. GitHub Pages kann keine echten
       HTTP-Kopfzeilen setzen; diese beiden wirken auch als <meta>. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://jedsuqylwgbyuuvyypdm.supabase.co">
  <meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seite nicht gefunden – Exelery</title>
<meta name="description" content="Diese Seite gibt es auf exelery.de nicht. Hier geht es zurück zur Startseite.">

<!-- Eine Fehlerseite gehört nicht in den Suchindex. -->
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<style>
  :root{
    --bg:#0B0F17;
    --card:#141B2A;
    --text:#F8FAFC;
    --muted:#94A3B8;
    --mint:#0DF2A3;
    --rule:rgba(255,255,255,.10);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    line-height:1.65;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .karte{
    width:100%;
    max-width:440px;
    background:var(--card);
    border:1px solid var(--rule);
    border-radius:18px;
    padding:38px 30px 32px;
    text-align:center;
  }
  .marke{
    margin:0 0 26px;
    font-size:.72em;
    letter-spacing:.28em;
    font-weight:700;
    color:var(--muted);
  }
  .zahl{
    font-size:3.4em;
    font-weight:800;
    line-height:1;
    margin:0 0 .18em;
    letter-spacing:-.03em;
    background:linear-gradient(135deg,#6FFFD0,#0DF2A3);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    /* Reserve fuer Unterlaengen: der Verlauf malt nur innerhalb der Box. */
    padding-bottom:.08em;
  }
  h1{font-size:1.4em;margin:0 0 .4em;letter-spacing:-.01em;}
  p{margin:.6em 0;color:var(--muted);font-size:.98em;}
  .knopf{
    display:block;
    margin:26px 0 0;
    padding:15px 22px;
    background:var(--mint);
    color:#04231A;
    font-size:1.02em;
    font-weight:700;
    border:0;
    border-radius:12px;
    text-decoration:none;
  }
  .weiter{
    margin:22px 0 0;
    padding-top:18px;
    border-top:1px solid var(--rule);
    font-size:.9em;
  }
  .weiter a{color:var(--muted);text-decoration:none;}
  .weiter a:hover{color:var(--text);}
  footer{
    margin:18px 0 0;
    font-size:.78em;
    color:#64748B;
  }
  footer a{color:#94A3B8;text-decoration:none;}
</style>
</head>
<body>

<main class="karte">
  <p class="marke">EXELERY</p>
  <p class="zahl">404</p>
  <h1>Diese Seite gibt es nicht.</h1>
  <p>Vielleicht ist der Link alt, oder beim Kopieren ist ein Stück verloren gegangen.</p>

  <a class="knopf" href="/">Zur Startseite</a>

  <p class="weiter">
    <a href="/faq/">Häufige Fragen</a>
    <span aria-hidden="true"> · </span>
    <a href="/#warteliste">Früher Zugang</a>
  </p>

  <footer>
    <a href="/impressum/">Impressum</a>
    <span aria-hidden="true"> · </span>
    <a href="/datenschutz/">Datenschutz</a>
  </footer>
</main>

</body>
</html>
