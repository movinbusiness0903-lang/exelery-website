<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
  <!-- Sicherheits-Kopfzeilen wie auf jeder Seite (pruefe-kopfzeilen.mjs). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://jedsuqylwgbyuuvyypdm.supabase.co">
  <meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exelery</title>

<!-- Ziel des QR-Codes auf dem Flyer (Kevin, 16.11.2026: „exelery.de/flyer
     einrichten, soll aber genauso hochwertig aussehen und halt dann evtl auf
     die mainpage weiterleiten").

     Die Seite leitet SOFORT auf die Startseite weiter, mit utm_source=flyer.
     Die Startseite gibt den Kanal bei der Eintragung in die Warteliste mit
     (HERKUNFT in index.html, `herkunft()` in supabase/functions/warteliste).
     So zaehlt man, wie viele sich ueber den Flyer eintragen — ohne Cookies,
     ohne Besuchszaehler, ohne Tracking. Besuche selbst werden NICHT gezaehlt.

     Die Karte unten sieht man nur, wenn die Weiterleitung nicht greift (kein
     JavaScript und kein Meta-Refresh). Sie hat denselben dunklen Grund wie die
     Startseite, damit der Wechsel nicht weiss aufblitzt.

     Nicht in den Suchindex und nicht in die Sitemap: eine Weiterleitung ist
     keine eigene Seite. -->
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Exelery – die Fitness-App, die mitdenkt: Training, Ernährung und Motivation in einer App.">
<meta http-equiv="refresh" content="0; url=/?utm_source=flyer">
<script>location.replace('/?utm_source=flyer');</script>

<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/app-link.css">
<style>
  /* Erst nach einer halben Sekunde zeigen: bei normaler Weiterleitung ist
     die Startseite dann laengst da, und niemand sieht die Karte aufblitzen. */
  .karte{opacity:0;animation:zeigen .4s ease .5s forwards;}
  @keyframes zeigen{to{opacity:1;}}
  @media (prefers-reduced-motion:reduce){.karte{animation:none;opacity:1;}}
  a.knopf{text-decoration:none;}
</style>
</head>
<body>

<main class="karte">
  <svg class="zeichen" viewBox="0 0 100 100" fill="none" aria-hidden="true">
    <defs>
      <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#6FFFD0"/>
        <stop offset="1" stop-color="#0DF2A3"/>
      </linearGradient>
    </defs>
    <path d="M30 24 L58 50 L30 76" stroke="url(#mint)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M52 24 L80 50 L52 76" stroke="#F8FAFC" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
  </svg>
  <p class="marke">Exelery</p>
  <h1>Dein Ziel. Deine Reise. Dein Erfolg.</h1>
  <p>Die Fitness-App, die mitdenkt: Training, Ernährung und Motivation, in einer App.</p>
  <a class="knopf" href="/?utm_source=flyer">Weiter zu Exelery</a>
</main>

</body>
</html>
